name: Build TrollStore IPA

on:
  push:
    branches: [ "master" ] # 👈 현재 브랜치인 master로 지정
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼 활성화

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Build Archive
      run: |
        xcodebuild -project StepsWrite.xcodeproj \
                   -scheme StepsWrite \
                   -configuration Release \
                   -sdk iphoneos \
                   -archivePath $PWD/build/StepsWrite.xcarchive \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   PROVISIONING_PROFILE_SPECIFIER="" \
                   DEVELOPMENT_TEAM="" \
                   archive
        # xcworkspace 대신 .xcodeproj 설정과 실제 이름(StepsWrite)을 반영했습니다.

    - name: Package IPA Manually
      run: |
        mkdir -p $PWD/build/ipa/Payload
        cp -r $PWD/build/StepsWrite.xcarchive/Products/Applications/*.app $PWD/build/ipa/Payload/
        cd $PWD/build/ipa
        zip -r StepsWrite_TrollStore.ipa Payload
        rm -rf Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TrollStore-IPA
        path: build/ipa/*.ipa
