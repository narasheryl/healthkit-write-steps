name: Build TrollStore IPA

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Build Archive
      run: |
        xcodebuild -project StepsWrite.xcodeproj \
                   -scheme StepsWrite \
                   -configuration Release \
                   -sdk iphoneos \
                   -archivePath $PWD/build/StepsWrite.xcarchive \
                   CODE_SIGNING_ALLOWED=YES \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="Apple Development" \
                   PROVISIONING_PROFILE_SPECIFIER="" \
                   DEVELOPMENT_TEAM="" \
                   CODE_SIGN_ENTITLEMENTS="StepsWrite.entitlements" \
                   archive
        # 💡 ALLOWED=YES와 임시 IDENTITY를 주어야 건강 앱 권한(Entitlements) 정보가 
        # 앱 바이너리 파일 내부에 누락 없이 완벽하게 컴파일되어 포함됩니다.

    - name: Package IPA Manually
      run: |
        # 1. 무서명 바이너리에 건강 앱 권한 테이블을 강제 주입하기 위한 ldid 도구 설치
        brew install ldid
        
        # 2. ldid 도구를 사용해 건강 앱 자격 증명(Entitlements)을 최종 각인
        ldid -SStepsWrite.entitlements build/StepsWrite.xcarchive/Products/Applications/StepsWrite.app/StepsWrite
        
        # 3. Payload 구조 생성 및 수동 패키징 압축
        mkdir -p $PWD/build/ipa/Payload
        cp -R build/StepsWrite.xcarchive/Products/Applications/StepsWrite.app build/ipa/Payload/
        cd build/ipa
        zip -r StepsWrite_TrollStore.ipa Payload
        rm -rf Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TrollStore-IPA
        path: build/ipa/*.ipa
