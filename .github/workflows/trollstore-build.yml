name: Build TrollStore IPA

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Build Archive
      run: |
        xcodebuild -project StepsWrite.xcodeproj \
                   -scheme StepsWrite \
                   -configuration Release \
                   -sdk iphoneos \
                   -archivePath $PWD/build/StepsWrite.xcarchive \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   PROVISIONING_PROFILE_SPECIFIER="" \
                   DEVELOPMENT_TEAM="" \
                   CODE_SIGN_ENTITLEMENTS="StepsWrite.entitlements" \
                   archive
        # ⚠️ 만약 빌드 에러가 나면 "StepsWrite/StepsWrite.entitlements" 부분을 
        # 실제 프로젝트 폴더 안에 있는 .entitlements 파일 경로에 맞게 수정해 주세요.

    - name: Package IPA Manually
      run: |
        # 1. 무서명 바이너리에 건강 앱 권한을 확실히 각인시키기 위한 ldid 도구 설치
        brew install ldid
        
        # 2. 건강 앱 권한 강제 주입 (ldid 부호화)
        ldid -SStepsWrite/StepsWrite.entitlements build/StepsWrite.xcarchive/Products/Applications/StepsWrite.app/StepsWrite
        
        # 3. Payload 구조 수동 패키징 및 압축
        mkdir -p $PWD/build/ipa/Payload
        cp -R $PWD/build/StepsWrite.xcarchive/Products/Applications/StepsWrite.app $PWD/build/ipa/Payload/
        cd $PWD/build/ipa
        zip -r StepsWrite_TrollStore.ipa Payload
        rm -rf Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TrollStore-IPA
        path: build/ipa/*.ipa
