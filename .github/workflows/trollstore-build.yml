name: Build TrollStore IPA

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Build Archive
      run: |
        xcodebuild -project StepsWrite.xcodeproj \
                   -scheme StepsWrite \
                   -configuration Release \
                   -sdk iphoneos \
                   -archivePath $PWD/build/StepsWrite.xcarchive \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   PROVISIONING_PROFILE_SPECIFIER="" \
                   DEVELOPMENT_TEAM="" \
                   archive

    - name: Package IPA and Bypass HealthKit Sandbox
      run: |
        # 1. 가짜 서명 도구 ldid 설치 (Homebrew 경고가 떠도 정상 설치됨)
        brew install ldid
        
        # 2. 패키징 폴더 생성
        mkdir -p Payload
        
        # 3. 🔥 핵심 교정: 이름 유추 실패 방지를 위해 .app 파일 실시간 자동 탐색 및 복사
        APP_PATH=$(find build/StepsWrite.xcarchive/Products/Applications -name "*.app" | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "❌ 빌드된 .app 파일을 찾을 수 없습니다. Xcode 빌드 단계를 다시 확인하세요."
          exit 1
        fi
        cp -R "$APP_PATH" Payload/
        
        # 4. 복사된 파일명 및 바이너리명 추출
        APP_NAME=$(basename "$APP_PATH")
        BINARY_NAME="${APP_NAME%.app}"
        
        # 5. 건강 앱 우회 권한 테이블 제조
        cat <<EOF > trollstore_health.entitlements
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
        <plist version="1.0">
        <dict>
            <key>com.apple.developer.healthkit</key>
            <true/>
            <key>com.apple.private.security.no-sandbox</key>
            <true/>
            <key>platform-application</key>
            <true/>
        </dict>
        </plist>
        EOF

        # 6. 자동 매칭된 바이너리에 건강 앱 샌드박스 우회 낙인 주입
        ldid -Strollstore_health.entitlements "Payload/$APP_NAME/$BINARY_NAME"
        
        # 7. 최종 트롤스토어 전용 IPA 생성
        zip -r StepsWrite_TrollStore.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TrollStore-IPA
        path: StepsWrite_TrollStore.ipa
