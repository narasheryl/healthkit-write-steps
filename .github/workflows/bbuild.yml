name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build and Sign with Entitlements
        run: |
          # 1. 무서명 빌드 진행
          xcodebuild build \
            -project StepsWrite.xcodeproj \
            -scheme StepsWrite \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_DIR=build

          # 2. entitlements 파일 위치 탐색 및 주입 준비
          APP_PATH=$(find build/Release-iphoneos -name "*.app" | head -n 1)
          ENTITLEMENTS=$(find . -name "*.entitlements" | head -n 1)

          # 3. Ad-hoc(임시 서명)으로 Entitlements 권한 강제 주입
          if [ -n "$ENTITLEMENTS" ]; then
            codesign --force --deep --sign - --entitlements "$ENTITLEMENTS" "$APP_PATH"
          else
            codesign --force --deep --sign - "$APP_PATH"
          fi

          # 4. IPA 파일로 패키징
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r App.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HealthKitApp-IPA
          path: App.ipa
